services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "5"
      # QA-only endpoints (/api/test/*) and free test=1 throws: unlocked only
      # with this token (?qa=<token> in the link, X-QA-Token / body qa= after)
      ENABLE_TEST_HOOKS: "1"
      QA_TOKEN: ${QA_TOKEN:-}
      # auth
      SESSION_SECRET: ${SESSION_SECRET:-void-dev-secret-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # ARG phase 1: solve notification (Discord/generic webhook URL)
      ARG_WEBHOOK_URL: ${ARG_WEBHOOK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # cosmic radio player (Jamendo proxy)
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      JAMENDO_CLIENT_SECRET: ${JAMENDO_CLIENT_SECRET:-}
      # NOWPayments gateway — real keys + NOWPAYMENTS_LIVE=1 go into .env
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_LIVE: ${NOWPAYMENTS_LIVE:-0}
      NOWPAYMENTS_WEBHOOK_IPS: ${NOWPAYMENTS_WEBHOOK_IPS:-*}
      # card widget (ChangeNOW): coin the invoice address expects and the
      # fiat buffer pre-filled into the widget to cover the on-ramp fee
      NOWPAYMENTS_PAY_CURRENCY: ${NOWPAYMENTS_PAY_CURRENCY:-usdttrc20}
      NOWPAYMENTS_CARD_BUFFER: ${NOWPAYMENTS_CARD_BUFFER:-1.08}
      # Cryptomus gateway — primary once its API is activated, NOWPayments is
      # the fallback. Real keys + CRYPTOMUS_LIVE=1 go into .env; until the
      # API answers, invoice requests transparently fall back to NOWPayments.
      CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID:-}
      CRYPTOMUS_PAYMENT_KEY: ${CRYPTOMUS_PAYMENT_KEY:-}
      CRYPTOMUS_PAYOUT_KEY: ${CRYPTOMUS_PAYOUT_KEY:-}
      CRYPTOMUS_LIVE: ${CRYPTOMUS_LIVE:-0}
      CRYPTOMUS_WEBHOOK_IPS: ${CRYPTOMUS_WEBHOOK_IPS:-91.227.144.54}
      CRYPTOMUS_PAY_CURRENCY: ${CRYPTOMUS_PAY_CURRENCY:-USDT}
      CRYPTOMUS_PAY_NETWORK: ${CRYPTOMUS_PAY_NETWORK:-tron}
      CRYPTOMUS_CARD_BUFFER: ${CRYPTOMUS_CARD_BUFFER:-1.08}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      # prod sets HTTP_ADDR=127.0.0.1 + HTTP_PORT=8080 in .env and puts a
      # TLS-terminating Caddy on the public 80/443; defaults keep local dev
      - "${HTTP_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  uploads_data:
