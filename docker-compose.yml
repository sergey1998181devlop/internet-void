services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: "5"
      # QA-only endpoints (/api/test/*) and free test=1 throws: unlocked only
      # with this token (?qa=<token> in the link, X-QA-Token / body qa= after)
      ENABLE_TEST_HOOKS: "1"
      QA_TOKEN: ${QA_TOKEN:-}
      # pre-launch entry gate (nginx auth_request -> /api/entry/auth).
      # Both empty = the gate is open and the site is launched.
      ENTRY_USER: ${ENTRY_USER:-}
      ENTRY_PASS: ${ENTRY_PASS:-}
      # auth
      SESSION_SECRET: ${SESSION_SECRET:-void-dev-secret-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # ARG phase 1: solve notification (Discord/generic webhook URL)
      ARG_WEBHOOK_URL: ${ARG_WEBHOOK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # cosmic radio player (Jamendo proxy)
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      JAMENDO_CLIENT_SECRET: ${JAMENDO_CLIENT_SECRET:-}
      # cryptomus gateway — real keys + CRYPTOMUS_LIVE=1 go into .env;
      # with the dev key below signed webhooks are already verifiable
      CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID:-}
      CRYPTOMUS_PAYMENT_KEY: ${CRYPTOMUS_PAYMENT_KEY:-void-dev-payment-key}
      CRYPTOMUS_PAYOUT_KEY: ${CRYPTOMUS_PAYOUT_KEY:-}
      CRYPTOMUS_LIVE: ${CRYPTOMUS_LIVE:-0}
      CRYPTOMUS_WEBHOOK_IPS: ${CRYPTOMUS_WEBHOOK_IPS:-91.227.144.54}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      # prod sets HTTP_ADDR=127.0.0.1 + HTTP_PORT=8080 in .env and puts a
      # TLS-terminating Caddy on the public 80/443; defaults keep local dev
      - "${HTTP_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # pre-launch gate: run ./scripts/gen-entry.sh after editing ENTRY_* in
      # .env (empty creds = open gate). Both files must exist, otherwise docker
      # turns the mount into a directory and nginx refuses to boot.
      - ./nginx/auth.conf:/etc/nginx/conf.d/00-auth.conf:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  uploads_data:
