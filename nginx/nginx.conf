# behind Caddy/TLS the client proto arrives as X-Forwarded-Proto: https;
# keep $scheme as the fallback for direct local access
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # the site is public: no auth gate, html/assets are served as-is and the
    # backend restart never takes the page down

    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # published share clips: the og: page socials scrape + the file itself
    location /v/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # hashed build assets: safe to cache forever
    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the SPA document must never be served from a stale cache
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache";
    }
}
