name: Deploy to prod

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time; an in-flight deploy is never cancelled mid-build
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync + docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PORT: ${{ secrets.PROD_PORT || 22 }}
      PROD_PATH: ${{ secrets.PROD_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH access
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # tolerate CRLF pastes; reject anything that is not a real key early
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > ~/.ssh/id_prod
          chmod 600 ~/.ssh/id_prod
          if ! ssh-keygen -y -f ~/.ssh/id_prod >/dev/null 2>&1; then
            echo "::error::PROD_SSH_KEY is not a loadable private key. Paste the WHOLE key including the -----BEGIN/END----- lines."
            exit 1
          fi
          ssh-keyscan -p "$PROD_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ship sources only; server keeps its own .env and data
      - name: Sync sources to the server
        run: |
          rsync -az --links --times \
            -e "ssh -i ~/.ssh/id_prod -p $PROD_PORT" \
            --exclude=.git \
            --exclude=.github \
            --exclude='**/node_modules' \
            --exclude=.env \
            --exclude=.DS_Store \
            ./ "${PROD_USER}@${PROD_HOST}:${PROD_PATH}/"

      - name: Build and roll over on the server
        run: |
          ssh -i ~/.ssh/id_prod -p "$PROD_PORT" "${PROD_USER}@${PROD_HOST}" \
            "bash -s -- '$PROD_PATH'" <<'EOF'
          set -e
          cd "$1"
          HP=$(grep -E '^HTTP_PORT=' .env 2>/dev/null | cut -d= -f2-)
          HP=${HP:-8080}
          docker compose build backend frontend
          docker compose up -d backend frontend
          # wait for the app to answer; the site is public, no auth gate
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${HP}/" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "healthcheck failed" >&2
            docker compose ps >&2 || true
            docker compose logs --tail=50 backend nginx >&2 || true
            exit 1
          fi
          docker image prune -f >/dev/null 2>&1 || true
          echo "deployed ok"
          EOF
